<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>协同指挥调度中心</title>
    <style>
        :root {
            --blue-deep: #0a0f23;
            --blue-panel: #0f1a33;
            --blue-card: rgba(16, 25, 50, 0.9);
            --blue-accent: #4a9eff;
            --blue-accent-dim: rgba(74, 158, 255, 0.6);
            --gold: #c9a84c;
            --text-primary: #e8edf5;
            --text-secondary: rgba(200, 210, 225, 0.65);
            --border: rgba(74, 158, 255, 0.18);
            --border-light: rgba(255,255,255,0.06);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
            display: flex;
            height: 100vh;
            background: var(--blue-deep);
            color: var(--text-primary);
            overflow: hidden;
        }

        /* ---- sidebar ---- */
        .sidebar {
            width: 272px;
            padding: 30px 20px 24px;
            background:
                linear-gradient(180deg, #111d3a 0%, #0d1630 40%, #0a1025 100%);
            border-right: 1px solid rgba(74, 158, 255, 0.15);
            display: flex;
            flex-direction: column;
            gap: 12px;
            z-index: 10;
            position: relative;
        }

        .sidebar::after {
            content: '';
            position: absolute;
            right: -1px; top: 0; bottom: 0;
            width: 1px;
            background: linear-gradient(180deg,
                transparent 0%,
                rgba(74,158,255,0.35) 20%,
                rgba(74,158,255,0.35) 80%,
                transparent 100%);
            pointer-events: none;
        }

        .sidebar h2 {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0 0 8px;
            color: #ffffff;
            text-align: center;
            letter-spacing: 0.06em;
            padding-bottom: 16px;
            border-bottom: 1px solid rgba(74,158,255,0.18);
            position: relative;
        }

        .sidebar h2::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 50%;
            transform: translateX(-50%);
            width: 48px;
            height: 2px;
            background: var(--blue-accent);
            border-radius: 2px;
        }

        /* ---- menu buttons ---- */
        .btn {
            min-height: 44px;
            padding: 0 16px;
            border-radius: 6px;
            border: 1px solid transparent;
            background: rgba(255,255,255,0.04);
            color: var(--text-primary);
            font-size: 13.5px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: inherit;
            letter-spacing: 0.03em;
        }

        .btn::before {
            content: '';
            width: 4px; height: 4px;
            border-radius: 50%;
            background: rgba(255,255,255,0.3);
            flex-shrink: 0;
            transition: background 0.2s;
        }

        .btn:hover {
            background: rgba(74,158,255,0.1);
            border-color: rgba(74,158,255,0.3);
            color: #ffffff;
        }
        .btn:hover::before { background: var(--blue-accent); }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            background: rgba(255,255,255,0.02);
        }
        .btn:disabled::before { background: rgba(255,255,255,0.15); }

        .btn-primary {
            background: linear-gradient(135deg, #2563eb, #3b82f6);
            border: none;
            color: #fff;
            font-weight: 600;
            box-shadow: 0 2px 12px rgba(37,99,235,0.3);
        }
        .btn-primary::before {
            background: rgba(255,255,255,0.8);
            width: 6px; height: 6px;
        }
        .btn-primary:hover {
            background: linear-gradient(135deg, #1d4ed8, #2563eb);
            color: #fff;
            box-shadow: 0 4px 18px rgba(37,99,235,0.45);
        }

        /* ---- status bar ---- */
        #status-bar {
            margin-top: auto;
            padding: 14px;
            border-radius: 6px;
            background: rgba(12, 22, 45, 0.7);
            border: 1px solid var(--border-light);
            font-size: 12.5px;
            color: var(--text-secondary);
            word-wrap: break-word;
            line-height: 1.5;
        }

        #status-bar.loading { color: var(--blue-accent) !important; }
        #status-bar.success { color: #5ec76e !important; }
        #status-bar.error { color: #e8915c !important; }

        /* ---- main content ---- */
        .main-content {
            flex: 1;
            display: flex;
            position: relative;
            background:
                radial-gradient(ellipse at 40% 30%, rgba(30,60,120,0.15) 0%, transparent 60%),
                radial-gradient(ellipse at 70% 70%, rgba(15,35,70,0.1) 0%, transparent 50%),
                var(--blue-deep);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }

        /* ---- loader ---- */
        #loader-overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 14, 30, 0.94);
            backdrop-filter: blur(6px);
            display: none;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 20;
        }

        .spinner {
            width: 44px; height: 44px;
            border: 3px solid rgba(74,158,255,0.12);
            border-top-color: var(--blue-accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 22px;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        #loader-text {
            color: var(--text-secondary);
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 0.04em;
        }

        @media (max-width: 860px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; max-height: 340px; }
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>协同指挥调度中心</h2>
        <button class="btn" id="btn1" onclick="launchApp('/api/run_2d', 'btn1', false)">协同调度平台</button>
        <button class="btn" id="btn2" onclick="launchApp('/api/run_3d_cesium', 'btn2', true)">三维态势地图</button>
        <button class="btn btn-primary" id="btn3" onclick="launchApp('/api/run_3d_strategy', 'btn3', true)">协同策略路径规划</button>
        <div id="status-bar">就绪，请选择模块启动系统。</div>
    </div>

    <div class="main-content">
        <div id="loader-overlay">
            <div class="spinner"></div>
            <h3 id="loader-text">算法正在解算中，请耐心等待（约需 10-20 秒）...</h3>
        </div>
        <iframe id="display-screen" src="about:blank"></iframe>
    </div>

    <script>
        function launchApp(apiEndpoint, btnId, showLoader) {
            const statusBar = document.getElementById('status-bar');
            const screen = document.getElementById('display-screen');
            const loader = document.getElementById('loader-overlay');
            const btns = document.querySelectorAll('.btn');

            btns.forEach(b => b.disabled = true);
            statusBar.className = "loading";
            statusBar.innerText = "正在向后端发送调度指令...";

            if (showLoader) loader.style.display = "flex";

            fetch(apiEndpoint)
                .then(response => response.json())
                .then(data => {
                    if (data.status === 'success') {
                        statusBar.className = "success";
                        statusBar.innerText = data.msg;
                        if (apiEndpoint === '/api/run_2d') {
                            setTimeout(() => { screen.src = data.url; }, 3000);
                        } else {
                            screen.src = data.url;
                        }
                    } else {
                        statusBar.className = "error";
                        statusBar.innerText = "启动失败: " + data.msg;
                    }
                })
                .catch(error => {
                    statusBar.className = "error";
                    statusBar.innerText = "网络通信中断，请检查服务器是否运行。";
                })
                .finally(() => {
                    btns.forEach(b => b.disabled = false);
                    if (showLoader) loader.style.display = "none";
                });
        }
    </script>
</body>
</html>
