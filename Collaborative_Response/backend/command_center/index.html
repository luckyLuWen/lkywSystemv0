<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>重大交通事故智能决策与救援系统</title>
    <style>
        body { margin: 0; font-family: 'Microsoft YaHei', sans-serif; display: flex; height: 100vh; background-color: #0f172a; color: white; overflow: hidden;}
        
        /* 左侧导航栏 */
        .sidebar { width: 280px; background-color: #1e293b; padding: 20px; display: flex; flex-direction: column; gap: 15px; box-shadow: 2px 0 15px rgba(0,0,0,0.5); z-index: 10; }
        .sidebar h2 { font-size: 1.3rem; margin-bottom: 20px; color: #38bdf8; text-align: center; border-bottom: 1px solid #334155; padding-bottom: 15px;}
        
        /* 炫酷按钮样式 */
        .btn { padding: 15px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: all 0.3s; color: white; display: flex; align-items: center; gap: 10px;}
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; box-shadow: none;}
        
        .btn-2d { background: linear-gradient(135deg, #2563eb, #3b82f6); }
        .btn-3d { background: linear-gradient(135deg, #7c3aed, #8b5cf6); }
        .btn-folium { background: linear-gradient(135deg, #059669, #10b981); }
        
        /* 状态提示信息 */
        #status-bar { margin-top: 20px; padding: 15px; background: #0f172a; border-radius: 8px; font-size: 0.9rem; color: #94a3b8; border: 1px solid #334155; word-wrap: break-word;}
        .loading { color: #f59e0b !important; font-weight: bold;}
        .success { color: #10b981 !important; font-weight: bold;}
        .error { color: #ef4444 !important; font-weight: bold;}

        /* 右侧展示区 */
        .main-content { flex: 1; display: flex; position: relative; background-color: #ffffff;}
        iframe { width: 100%; height: 100%; border: none; }
        
        /* 加载动画遮罩层 */
        #loader-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.9); display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 20;}
        .spinner { border: 5px solid #334155; border-top: 5px solid #38bdf8; border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin-bottom: 20px;}
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>🚨 两客一危路径规划决策总系统</h2>
        <button class="btn btn-2d" id="btn1" onclick="launchApp('/api/run_2d', 'btn1', false)">📊 多类场景调度救援</button>
        <button class="btn btn-3d" id="btn2" onclick="launchApp('/api/run_3d_cesium', 'btn2', true)">🌍 三维视景cesium动态推演</button>
        <button class="btn btn-folium" id="btn3" onclick="launchApp('/api/run_3d_strategy', 'btn3', true)">📈 无人机/车协同策略路径规划</button>
        <div id="status-bar">就绪。请选择左侧模块启动系统。</div>
    </div>

    <div class="main-content">
        <div id="loader-overlay">
            <div class="spinner"></div>
            <h3 style="color: #38bdf8;" id="loader-text">底层算法正在解算中，请耐心等待 (约需10-20秒)...</h3>
        </div>
        <iframe id="display-screen" src="about:blank"></iframe>
    </div>

    <script>
        function launchApp(apiEndpoint, btnId, showLoader) {
            const statusBar = document.getElementById('status-bar');
            const screen = document.getElementById('display-screen');
            const loader = document.getElementById('loader-overlay');
            const btns = document.querySelectorAll('.btn');
            
            // 锁定按钮防止重复点击
            btns.forEach(b => b.disabled = true);
            statusBar.className = "loading";
            statusBar.innerText = "正在向后端发送调度指令...";
            
            if(showLoader) loader.style.display = "flex";

            // 通过 Fetch API 调用 Python 后端
            fetch(apiEndpoint)
                .then(response => response.json())
                .then(data => {
                    if(data.status === 'success') {
                        statusBar.className = "success";
                        statusBar.innerText = data.msg;
                        
                        // 针对 Streamlit 需要稍微等几秒让其启动
                        if(apiEndpoint === '/api/run_2d') {
                            setTimeout(() => { screen.src = data.url; }, 3000);
                        } else {
                            screen.src = data.url; // 注入生成的 HTML 或 Cesium
                        }
                    } else {
                        statusBar.className = "error";
                        statusBar.innerText = "启动失败: " + data.msg;
                    }
                })
                .catch(error => {
                    statusBar.className = "error";
                    statusBar.innerText = "网络通信中断，请检查 server.py 是否运行。";
                })
                .finally(() => {
                    btns.forEach(b => b.disabled = false);
                    if(showLoader) loader.style.display = "none";
                });
        }
    </script>
</body>
</html>
