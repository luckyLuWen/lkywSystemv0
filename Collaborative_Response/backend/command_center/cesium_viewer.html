<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>三维态势地图</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #020617;
        }

        .hint {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            max-width: 380px;
            padding: 12px 14px;
            border-radius: 8px;
            background: rgba(12, 20, 40, 0.88);
            color: rgba(200, 210, 225, 0.7);
            font: 13px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif;
            border: 1px solid rgba(74, 158, 255, 0.18);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        }

        .layerPicker {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            background: rgba(12, 20, 40, 0.92);
            border-radius: 8px;
            border: 1px solid rgba(74, 158, 255, 0.2);
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .layerPicker button {
            display: block;
            width: 160px;
            padding: 10px 14px;
            border: none;
            background: transparent;
            color: rgba(200, 210, 225, 0.8);
            font: 12px/1.5 "Microsoft YaHei", "PingFang SC", sans-serif;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .layerPicker button:hover {
            background: rgba(74, 158, 255, 0.15);
            color: #fff;
        }

        .layerPicker button.active {
            background: rgba(74, 158, 255, 0.25);
            color: #4a9eff;
        }

        .layerPicker .title {
            padding: 8px 14px;
            font-size: 11px;
            color: rgba(200, 210, 225, 0.4);
            border-bottom: 1px solid rgba(74, 158, 255, 0.1);
        }
    </style>
    <script>
        window.CESIUM_BASE_URL = "/Cesium/";
    </script>
    <script src="/Cesium/Cesium.js"></script>
    <link href="/Cesium/Widgets/widgets.css" rel="stylesheet">
</head>
<body>
    <div class="hint">
        三维态势地图使用本地 Cesium 资源包。若当前未看到路径动画，请先通过协同响应页执行一次“三维态势生成”。
    </div>
    <div class="layerPicker">
        <div class="title">底图选择</div>
        <button id="layer1" class="active">🌍 地形底图</button>
        <button id="layer2">🗺️ 街道地图</button>
        <button id="layer3">🛰️ 卫星影像</button>
        <button id="layer4">🏔️ 地形+c:\Users\Administrator\lkywSystemv0\Collaborative_Response\backend\command_center\cesium_viewer.html

    </div>
    <div id="cesiumContainer"></div>
    <script>
        Cesium.Ion.defaultAccessToken =
            "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIyYTUwYmE4Zi01ZjZlLTQ0MjAtYWMwNS0yYjBkZGFiM2RmOTUiLCJpZCI6MzU4MzQ0LCJpYXQiOjE3NjI1Nzc2NjR9.q9QoG-_99QZ2R2TlUYjiWGhn0-S5I22FFGuou_NAE3Q";

        const viewer = new Cesium.Viewer("cesiumContainer", {
            animation: true,
            timeline: true,
            baseLayerPicker: false,
            geocoder: false,
            sceneModePicker: false,
            navigationHelpButton: false,
            infoBox: true,
            terrainProvider: Cesium.createWorldTerrain(),
        });

        viewer.cesiumWidget.creditContainer.style.display = "none";

        // 定义不同的底图图层
        const baseLayers = {
            terrain: new Cesium.ImageryLayer(Cesium.createWorldImagery()),
            street: new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({
                url: 'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png'
            })),
            satellite: new Cesium.ImageryLayer(new Cesium.ArcGisMapServerImageryProvider({
                url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
            })),
            hybrid: new Cesium.ImageryLayer(new Cesium.ArcGisMapServerImageryProvider({
                url: 'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer'
            })),
            dark: new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({
                url: 'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png'
            }))
        };

        function setBaseLayer(layerKey) {
            viewer.imageryLayers.removeAll();
            viewer.imageryLayers.add(baseLayers[layerKey]);
            
            // 更新按钮状态
            document.querySelectorAll('.layerPicker button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
        }

        document.getElementById('layer1').addEventListener('click', () => setBaseLayer('terrain'));
        document.getElementById('layer2').addEventListener('click', () => setBaseLayer('street'));
        document.getElementById('layer3').addEventListener('click', () => setBaseLayer('satellite'));
        document.getElementById('layer4').addEventListener('click', () => setBaseLayer('hybrid'));
        document.getElementById('layer5').addEventListener('click', () => setBaseLayer('dark'));

        async function addBuildings() {
            try {
                const buildings = await Cesium.createOsmBuildingsAsync();
                viewer.scene.primitives.add(buildings);
                buildings.style = new Cesium.Cesium3DTileStyle({
                    color: "color('#ffffff', 0.72)",
                });
            } catch (error) {
                console.warn("OSM 建筑加载失败，将继续显示轨迹场景", error);
            }
        }

        async function loadMission() {
            const dataSource = await Cesium.CzmlDataSource.load("/mission.czml");
            viewer.dataSources.add(dataSource);
            await viewer.flyTo(dataSource, {
                offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-30), 1600),
            });
        }

        addBuildings();
        loadMission().catch((error) => {
            console.error("CZML 加载失败", error);
        });
    </script>
</body>
</html>
