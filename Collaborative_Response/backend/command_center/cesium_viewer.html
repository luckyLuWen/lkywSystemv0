<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>三维态势地图</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body, #cesiumContainer {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #020617;
        }

        .hint {
            position: absolute;
            top: 16px;
            left: 16px;
            z-index: 10;
            max-width: 380px;
            padding: 12px 14px;
            border-radius: 8px;
            background: rgba(12, 20, 40, 0.88);
            color: rgba(200, 210, 225, 0.7);
            font: 13px/1.6 "Microsoft YaHei", "PingFang SC", sans-serif;
            border: 1px solid rgba(74, 158, 255, 0.18);
            backdrop-filter: blur(8px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        }

        .layerPicker {
            position: absolute;
            top: 16px;
            right: 16px;
            z-index: 10;
            background: rgba(12, 20, 40, 0.92);
            border-radius: 8px;
            border: 1px solid rgba(74, 158, 255, 0.2);
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.2);
        }

        .layerPicker button {
            display: block;
            width: 160px;
            padding: 10px 14px;
            border: none;
            background: transparent;
            color: rgba(200, 210, 225, 0.8);
            font: 12px/1.5 "Microsoft YaHei", "PingFang SC", sans-serif;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s;
        }

        .layerPicker button:hover {
            background: rgba(74, 158, 255, 0.15);
            color: #fff;
        }

        .layerPicker button.active {
            background: rgba(74, 158, 255, 0.25);
            color: #4a9eff;
        }

        .layerPicker .title {
            padding: 8px 14px;
            font-size: 11px;
            color: rgba(200, 210, 225, 0.4);
            border-bottom: 1px solid rgba(74, 158, 255, 0.1);
        }
    </style>
    <script>
        window.CESIUM_BASE_URL = "https://cesium.com/downloads/cesiumjs/releases/1.107/Build/Cesium/";
    </script>
    <script src="https://cesium.com/downloads/cesiumjs/releases/1.107/Build/Cesium/Cesium.js"></script>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.107/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
</head>
<body>
    <div class="hint">
        三维态势地图 - 使用武汉光谷区域数据。若未看到路径动画，请先执行一次"生成三维态势"。
    </div>
    <div class="layerPicker">
        <div class="title">底图选择</div>
        <button id="layer1" class="active">🗺 街道地图</button>
        <button id="layer2">🛰 卫星影像</button>
        <button id="layer3">🌙 暗色地图</button>
    </div>
    <div id="cesiumContainer"></div>
    <script>
        Cesium.Ion.defaultAccessToken = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJqdGkiOiIxYzJmMGMwOC0xMzk0LTQ4MzUtYjEzOS1jY2Y5MDcxMmM1MjMiLCJpZCI6MzU4MzQ0LCJzdWIiOiJ3YXRlcjI3MzcwODYzNTEiLCJpc3MiOiJodHRwczovL2lvbi5jZXNpdW0uY29tIiwiYXVkIjoiVW50aXRsZWQiLCJpYXQiOjE3NzkyNjA4MDN9.h0Dj98rzNnqOnqdI7cZw1cF44TpuY4qWvx7KAaLMyY0";

        var viewer = new Cesium.Viewer("cesiumContainer", {
            animation: true,
            timeline: true,
            baseLayerPicker: false,
            geocoder: false,
            sceneModePicker: false,
            navigationHelpButton: false,
            infoBox: true
        });

        viewer.cesiumWidget.creditContainer.style.display = "none";

        var baseLayers = {
            street: new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({
                url: "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png"
            })),
            satellite: new Cesium.ImageryLayer(new Cesium.ArcGisMapServerImageryProvider({
                url: "https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer"
            })),
            dark: new Cesium.ImageryLayer(new Cesium.OpenStreetMapImageryProvider({
                url: "https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}.png"
            }))
        };

        viewer.imageryLayers.removeAll();
        viewer.imageryLayers.add(baseLayers.street);

        function setBaseLayer(layerKey, clickEvent) {
            viewer.imageryLayers.removeAll();
            viewer.imageryLayers.add(baseLayers[layerKey]);
            var buttons = document.querySelectorAll(".layerPicker button");
            for (var i = 0; i < buttons.length; i++) {
                buttons[i].classList.remove("active");
            }
            if (clickEvent && clickEvent.target) {
                clickEvent.target.classList.add("active");
            }
        }

        function bindLayerButton(id, layerKey) {
            var btn = document.getElementById(id);
            if (btn) {
                btn.addEventListener("click", function(e) {
                    setBaseLayer(layerKey, e);
                });
            }
        }

        bindLayerButton("layer1", "street");
        bindLayerButton("layer2", "satellite");
        bindLayerButton("layer3", "dark");

        async function addBuildings() {
            try {
                var buildings = await Cesium.createOsmBuildingsAsync();
                viewer.scene.primitives.add(buildings);
                buildings.style = new Cesium.Cesium3DTileStyle({
                    color: "color('#ffffff', 0.72)"
                });
            } catch (error) {
                console.warn("OSM building load failed, continuing with path display", error);
            }
        }

        async function loadMission() {
            var dataSource = await Cesium.CzmlDataSource.load("/mission.czml");
            viewer.dataSources.add(dataSource);
            viewer.flyTo(dataSource, {
                offset: new Cesium.HeadingPitchRange(0, Cesium.Math.toRadians(-30), 1600)
            });
        }

        addBuildings();
        loadMission().catch(function(error) {
            console.error("CZML load failed", error);
        });
    </script>
</body>
</html>
