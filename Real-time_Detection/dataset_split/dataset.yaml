# YOLOv11 数据集配置文件 - 两客一危火灾检测

# 数据集路径（相对于此yaml文件的路径）
path: D:/All_Dataset/两客一危自制数据集/dataset_split  # 数据集根目录
train: train/images  # 训练集图片路径
val: val/images      # 验证集图片路径
test: test/images    # 测试集图片路径

# 类别数量
nc: 4

# 类别名称（按照标注顺序）
names:
  0: car_fire      # 普通车辆火灾
  1: car_nofire    # 普通车辆非火灾
  2: lkyw_fire     # 两客一危车辆火灾
  3: lkyw_nofire   # 两客一危车辆非火灾
